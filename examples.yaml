## Sensor Templates

### Template Sensor: Self-Sufficiency Percentage

sensor:
  - platform: template
    sensors:
      intellicharge_self_sufficiency:
        friendly_name: "Self-Sufficiency Rate"
        unit_of_measurement: "%"
        value_template: >
          {% set consumed = states('sensor.consumed_energy') | float %}
          {% set produced = states('sensor.produced_energy') | float %}
          {{ ((produced / consumed * 100) | round(1)) if consumed > 0 else 0 }}
        icon_template: mdi:solar-power

### Template Sensor: Grid Independence

sensor:
  - platform: template
    sensors:
      intellicharge_grid_independence:
        friendly_name: "Grid Independence"
        unit_of_measurement: "%"
        value_template: >
          {% set consumed = states('sensor.consumed_energy') | float %}
          {% set purchased = states('sensor.purchased_energy') | float %}
          {% set independence = (1 - (purchased / consumed)) * 100 if consumed > 0 else 0 %}
          {{ independence | round(1) }}
        icon_template: mdi:transmission-tower-off

### Template Sensor: Effective Energy Price

sensor:
  - platform: template
    sensors:
      intellicharge_effective_price:
        friendly_name: "Effective Energy Price"
        unit_of_measurement: "DKK/kWh"  # Change to your currency
        value_template: >
          {% set cost = states('sensor.net_cost') | float %}
          {% set consumed = states('sensor.consumed_energy') | float %}
          {{ (cost / consumed) | round(2) if consumed > 0 else 0 }}
        icon_template: mdi:currency-usd
