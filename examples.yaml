## Sensor Templates

### Template Sensor: Self-Sufficiency Percentage

sensor:
  - platform: template
    sensors:
      intellicharge_self_sufficiency:
        friendly_name: "Self-Sufficiency Rate"
        unit_of_measurement: "%"
        value_template: >
          {% set consumed = states('sensor.consumed_energy') | float %}
          {% set produced = states('sensor.produced_energy') | float %}
          {{ ((produced / consumed * 100) | round(1)) if consumed > 0 else 0 }}
        icon_template: mdi:solar-power

### Template Sensor: Grid Independence

sensor:
  - platform: template
    sensors:
      intellicharge_grid_independence:
        friendly_name: "Grid Independence"
        unit_of_measurement: "%"
        value_template: >
          {% set consumed = states('sensor.consumed_energy') | float %}
          {% set purchased = states('sensor.purchased_energy') | float %}
          {% set independence = (1 - (purchased / consumed)) * 100 if consumed > 0 else 0 %}
          {{ independence | round(1) }}
        icon_template: mdi:transmission-tower-off

### Template Sensor: Effective Energy Price

sensor:
  - platform: template
    sensors:
      intellicharge_effective_price:
        friendly_name: "Effective Energy Price"
        unit_of_measurement: "DKK/kWh"  # Change to your currency
        value_template: >
          {% set cost = states('sensor.net_cost') | float %}
          {% set consumed = states('sensor.consumed_energy') | float %}
          {{ (cost / consumed) | round(2) if consumed > 0 else 0 }}
        icon_template: mdi:currency-usd

## Custom Charging Rules Examples

### Example 1: Basic charging rule - All days, all time
# Set a simple charging rule that applies every day

service: intellicharge.set_charging_rules
data:
  rules:
    - monday: true
      tuesday: true
      wednesday: true
      thursday: true
      friday: true
      saturday: true
      sunday: true
      valid_from: "00:00:00"
      valid_to: "23:59:59"
      max_charge: 4001
      max_discharge: null
      max_battery_soc: null
      min_battery_soc: null
      min_battery_soc_for_sell: null

### Example 2: Different rules for weekdays and weekends

service: intellicharge.set_charging_rules
data:
  rules:
    # Weekday rule - standard charging
    - monday: true
      tuesday: true
      wednesday: true
      thursday: true
      friday: true
      saturday: false
      sunday: false
      valid_from: "00:00:00"
      valid_to: "23:59:59"
      max_charge: 5000
      max_discharge: 3000
      max_battery_soc: 100
      min_battery_soc: 20
      min_battery_soc_for_sell: 50
    # Weekend rule - reduced charging
    - monday: false
      tuesday: false
      wednesday: false
      thursday: false
      friday: false
      saturday: true
      sunday: true
      valid_from: "00:00:00"
      valid_to: "23:59:59"
      max_charge: 3000
      max_discharge: 2000
      max_battery_soc: 90
      min_battery_soc: 30
      min_battery_soc_for_sell: 60

### Example 3: Time-based rules for peak/off-peak hours

service: intellicharge.set_charging_rules
data:
  rules:
    # Night time - high charging rate
    - monday: true
      tuesday: true
      wednesday: true
      thursday: true
      friday: true
      saturday: true
      sunday: true
      valid_from: "00:00:00"
