### Dashboard 5: Gauge Card for Savings

type: gauge
entity: sensor.savings_vs_no_system_pct
name: Savings vs No System
unit: '%'
min: 0
max: 100
needle: true
segments:
  - from: 0
    color: '#db4437'
  - from: 5
    color: '#ff9800'
  - from: 10
    color: '#4caf50'
  - from: 20
    color: '#0f9d58'

### Dashboard 6: Energy Flow Sankey Diagram
# Requires custom:sankey-chart card from HACS

type: custom:sankey-chart
entities:
  - entity_id: sensor.produced_energy
    children:
      - entity_id: sensor.consumed_energy
        color: '#4caf50'
      - entity_id: sensor.sold_energy
        color: '#2196f3'
  - entity_id: sensor.purchased_energy
    children:
      - entity_id: sensor.consumed_energy
        color: '#ff9800'
title: Energy Flow
height: 400
show_names: true
show_units: true

### Dashboard 7: Historical Trends
# Requires apex-charts card from HACS

type: custom:apexcharts-card
header:
  show: true
  title: Energy Trends (Last 30 Days)
graph_span: 30d
span:
  end: day
series:
  - entity: sensor.consumed_energy
    name: Consumed
    type: area
    color: '#ff9800'
  - entity: sensor.produced_energy
    name: Produced
    type: area
    color: '#4caf50'
  - entity: sensor.purchased_energy
    name: Purchased
    type: line
    color: '#f44336'
  - entity: sensor.sold_energy
    name: Sold
    type: line
    color: '#2196f3'

