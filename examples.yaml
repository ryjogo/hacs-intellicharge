## Example Lovelace Dashboards

### Dashboard 1: Overview Card

type: vertical-stack
cards:
  - type: markdown
    content: |
      ## ⚡ Energy Overview
  - type: horizontal-stack
    cards:
      - type: statistic
        entity: sensor.consumed_energy
        name: Consumed
        icon: mdi:flash
        period:
          calendar:
            period: month
      - type: statistic
        entity: sensor.produced_energy
        name: Produced
        icon: mdi:solar-power
        period:
          calendar:
            period: month
  - type: horizontal-stack
    cards:
      - type: statistic
        entity: sensor.purchased_energy
        name: From Grid
        icon: mdi:transmission-tower
        period:
          calendar:
            period: month
      - type: statistic
        entity: sensor.sold_energy
        name: To Grid
        icon: mdi:transmission-tower-export
        period:
          calendar:
            period: month

### Dashboard 2: Financial Summary

type: vertical-stack
cards:
  - type: markdown
    content: |
      ## 💰 Financial Summary
  - type: glance
    entities:
      - entity: sensor.net_cost
        name: Net Cost
      - entity: sensor.purchase_cost
        name: Purchase Cost
      - entity: sensor.sell_revenue
        name: Sell Revenue
  - type: markdown
    content: |
      ## 📊 Savings Analysis
  - type: entities
    entities:
      - entity: sensor.savings_vs_no_system
        name: Savings vs No Solar
        icon: mdi:piggy-bank
      - entity: sensor.savings_vs_no_system_pct
        name: Savings Percentage
        icon: mdi:percent
      - entity: sensor.savings_vs_self_consumption
        name: Smart Optimization Benefit
        icon: mdi:brain
      - type: divider
      - entity: sensor.no_system_net_cost
        name: Cost Without Solar
        icon: mdi:currency-usd-off

### Dashboard 3: Detailed Comparison

type: vertical-stack
cards:
  - type: markdown
    content: |
      ## 🔍 System Comparison
      Compare your actual performance against alternative scenarios
  - type: custom:bar-card
    entities:
      - entity: sensor.realised_net_cost
        name: Your System
        color: '#4caf50'
      - entity: sensor.self_consumption_net_cost
        name: Self-Consumption Only
        color: '#ff9800'
      - entity: sensor.no_system_net_cost
        name: No Solar System
        color: '#f44336'
    title: Net Cost Comparison
    height: 50px
    width: 100%
    positions:
      icon: 'off'
      name: inside
      value: inside
  - type: entities
    title: Energy Flow Details
    entities:
      - type: section
        label: Your Actual System
      - entity: sensor.consumed_energy
      - entity: sensor.produced_energy
      - entity: sensor.purchased_energy
      - entity: sensor.sold_energy
      - type: section
        label: Self-Consumption Mode
      - entity: sensor.self_consumption_consumed
      - entity: sensor.self_consumption_produced
      - entity: sensor.self_consumption_purchased
      - type: section
        label: No System Scenario
      - entity: sensor.no_system_consumed
      - entity: sensor.no_system_purchased

### Dashboard 4: Simple Status Card

type: entities
title: IntelliCharge Status
entities:
  - entity: sensor.consumed_energy
    name: Energy Consumed
    icon: mdi:flash
  - entity: sensor.produced_energy
    name: Solar Production
    icon: mdi:solar-power
  - entity: sensor.net_cost
    name: Net Cost
    icon: mdi:currency-usd
  - entity: sensor.savings_vs_no_system
    name: Total Savings
    icon: mdi:piggy-bank
  - entity: sensor.savings_vs_no_system_pct
    name: Savings %
    icon: mdi:percent
