  title: Energy Trends (Last 30 Days)
graph_span: 30d
span:
  end: day
series:
  - entity: sensor.consumed_energy
    name: Consumed
    type: area
    color: '#ff9800'
  - entity: sensor.produced_energy
    name: Produced
    type: area
    color: '#4caf50'
  - entity: sensor.purchased_energy
    name: Purchased
    type: line
    color: '#f44336'
  - entity: sensor.sold_energy
    name: Sold
    type: line
    color: '#2196f3'

