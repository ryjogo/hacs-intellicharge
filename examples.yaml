# Example Automations and Dashboards for IntelliCharge Integration

## Example Automations

### 1. Daily Energy Report Notification
# Sends a notification at 8 AM with yesterday's energy summary

automation:
  - alias: "IntelliCharge Daily Energy Report"
    trigger:
      - platform: time
        at: "08:00:00"
    action:
      - service: notify.mobile_app
        data:
          title: "Daily Energy Report"
          message: >
            Yesterday's Energy Summary:
            Consumed: {{ states('sensor.consumed_energy') }} kWh
            Produced: {{ states('sensor.produced_energy') }} kWh
            Savings: {{ states('sensor.savings_vs_no_system') }} {{ state_attr('sensor.savings_vs_no_system', 'unit_of_measurement') }}
            ({{ states('sensor.savings_vs_no_system_pct') }}%)

### 2. High Savings Alert
# Alerts when savings exceed 20% compared to no system

automation:
  - alias: "IntelliCharge High Savings Alert"
    trigger:
      - platform: numeric_state
        entity_id: sensor.savings_vs_no_system_pct
        above: 20
    condition:
      - condition: template
        value_template: >
          {{ (now() - state_attr('automation.intellicharge_high_savings_alert', 'last_triggered')).total_seconds() > 86400 }}
    action:
      - service: notify.mobile_app
        data:
          title: "Great Energy Savings!"
          message: >
            Your system is performing excellently!
            You're saving {{ states('sensor.savings_vs_no_system_pct') }}% 
            ({{ states('sensor.savings_vs_no_system') }} {{ state_attr('sensor.savings_vs_no_system', 'unit_of_measurement') }})
            compared to having no solar system.

### 3. Low Production Warning
# Warns if solar production is unusually low

automation:
  - alias: "IntelliCharge Low Production Warning"
    trigger:
      - platform: time
        at: "18:00:00"
    condition:
      - condition: numeric_state
        entity_id: sensor.produced_energy
        below: 5  # Adjust based on your typical production
    action:
      - service: notify.mobile_app
        data:
          title: "Low Solar Production"
          message: >
            Today's solar production is only {{ states('sensor.produced_energy') }} kWh.
            This is lower than usual. Check if panels need cleaning or if there's an issue.

### 4. Monthly Savings Summary
# Sends a monthly summary on the 1st of each month

automation:
  - alias: "IntelliCharge Monthly Summary"
    trigger:
      - platform: time
        at: "09:00:00"
    condition:
      - condition: template
        value_template: "{{ now().day == 1 }}"
    action:
      - service: notify.mobile_app
        data:
          title: "Monthly Energy Summary"
          message: >
            Last Month's Performance:
            
            Energy:
            • Consumed: {{ states('sensor.consumed_energy') }} kWh
            • Produced: {{ states('sensor.produced_energy') }} kWh
            • Grid Import: {{ states('sensor.purchased_energy') }} kWh
            • Grid Export: {{ states('sensor.sold_energy') }} kWh
            
            Savings:
            • vs No System: {{ states('sensor.savings_vs_no_system') }} {{ state_attr('sensor.savings_vs_no_system', 'unit_of_measurement') }} ({{ states('sensor.savings_vs_no_system_pct') }}%)
            • vs Self-Consumption: {{ states('sensor.savings_vs_self_consumption') }} {{ state_attr('sensor.savings_vs_self_consumption', 'unit_of_measurement') }}
            
            Keep up the great work! 🌞

