## Scripting Examples

### Script: Calculate Self-Sufficiency Rate

script:
  calculate_self_sufficiency:
    alias: "Calculate Self-Sufficiency Rate"
    sequence:
      - service: notify.persistent_notification
        data:
          title: "Energy Self-Sufficiency"
          message: >
            {% set consumed = states('sensor.consumed_energy') | float %}
            {% set produced = states('sensor.produced_energy') | float %}
            {% set self_sufficiency = (produced / consumed * 100) | round(1) if consumed > 0 else 0 %}
            
            Self-Sufficiency Rate: {{ self_sufficiency }}%
            
            This means {{ self_sufficiency }}% of your energy needs 
            are met by your solar production.

### Script: Export Energy Data to CSV
# Requires folder_watcher integration

script:
  export_intellicharge_data:
    alias: "Export IntelliCharge Data"
    sequence:
      - service: notify.persistent_notification
        data:
          title: "Data Export"
          message: |
            Date: {{ now().strftime('%Y-%m-%d') }}
            Consumed: {{ states('sensor.consumed_energy') }} kWh
            Produced: {{ states('sensor.produced_energy') }} kWh
            Purchased: {{ states('sensor.purchased_energy') }} kWh
            Sold: {{ states('sensor.sold_energy') }} kWh
            Net Cost: {{ states('sensor.net_cost') }} {{ state_attr('sensor.net_cost', 'unit_of_measurement') }}
            Savings: {{ states('sensor.savings_vs_no_system') }} {{ state_attr('sensor.savings_vs_no_system', 'unit_of_measurement') }}

